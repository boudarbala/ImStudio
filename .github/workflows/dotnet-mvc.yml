name: .NET MVC Build

on:
  push:
    branches: [ dotnet-mvc ]
  pull_request:
    branches: [ dotnet-mvc ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Restore
        run: dotnet restore src/ImStudio.Web/ImStudio.Web.csproj
      - name: Build
        run: dotnet build src/ImStudio.Web/ImStudio.Web.csproj --configuration Release --no-restore
      - name: Publish
        run: dotnet publish src/ImStudio.Web/ImStudio.Web.csproj --configuration Release --no-build --output ./publish
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: imstudio-dotnet-mvc
          path: ./publish
